{% extends "layout.html" %}
{% block title %}Đăng ký tài khoản - Hệ thống Quản lý Khách sạn{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
        <div class="card shadow-lg" style="border-radius: 16px; overflow: hidden; border: none;">
            <!-- Card Header -->
            <div style="background: linear-gradient(135deg, #0d2b6b 0%, #1a56db 100%); padding: 24px 32px; text-align: center;">
                <i class="bi bi-person-plus-fill" style="font-size: 2rem; color: #fbbf24;"></i>
                <h4 style="color: #fff; font-weight: 800; margin: 8px 0 0; font-size: 1.3rem;">Đăng ký tài khoản Khách hàng</h4>
                <p style="color: rgba(255,255,255,0.7); margin: 4px 0 0; font-size: 0.85rem;">Điền thông tin để tạo tài khoản mới</p>
            </div>
            <!-- Card Body -->
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.dang_ky') }}">
                    <!-- Personal Info Section -->
                    <p style="font-weight: 700; color: #1a56db; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 14px;">
                        <i class="bi bi-person-badge me-1"></i>Thông tin cá nhân
                    </p>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Họ tên <span style="color:#e02424;">*</span></label>
                            <input type="text" class="form-control" name="ho_ten" value="{{ form.ho_ten if form else '' }}" required placeholder="Nguyễn Văn A">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Số CCCD <span style="color:#e02424;">*</span></label>
                            <input type="text" class="form-control" name="cccd" value="{{ form.cccd if form else '' }}" required placeholder="012345678901">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Ngày sinh</label>
                            <input type="date" class="form-control" name="ngay_sinh" value="{{ form.ngay_sinh if form else '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Số điện thoại <span style="color:#e02424;">*</span></label>
                            <input type="text" class="form-control" name="sdt" value="{{ form.sdt if form else '' }}" required placeholder="0912345678">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" value="{{ form.email if form else '' }}" placeholder="example@email.com">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Địa chỉ</label>
                            <input type="text" class="form-control" name="dia_chi" value="{{ form.dia_chi if form else '' }}" placeholder="Số nhà, đường, quận...">
                        </div>
                    </div>

                    <hr style="border-color: #e2e8f0; margin: 8px 0 16px;">

                    <!-- Account Info Section -->
                    <p style="font-weight: 700; color: #1a56db; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 14px;">
                        <i class="bi bi-shield-lock me-1"></i>Thông tin tài khoản
                    </p>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Tên tài khoản <span style="color:#e02424;">*</span></label>
                            <input type="text" class="form-control" name="tai_khoan" value="{{ form.tai_khoan if form else '' }}" required placeholder="Tên đăng nhập">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">&nbsp;</label>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Mật khẩu <span style="color:#e02424;">*</span></label>
                            <input type="password" class="form-control" name="mat_khau" required minlength="6" placeholder="Tối thiểu 6 ký tự">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Xác nhận mật khẩu <span style="color:#e02424;">*</span></label>
                            <input type="password" class="form-control" name="xac_nhan_mat_khau" required minlength="6" placeholder="Nhập lại mật khẩu">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-2" style="padding: 12px;">
                        <i class="bi bi-person-check me-2"></i>Tạo tài khoản
                    </button>
                </form>
                <hr style="border-color: #e2e8f0; margin: 20px 0 14px;">
                <p class="text-center mb-0" style="color: #6b7280; font-size: 0.9rem;">
                    Đã có tài khoản?
                    <a href="{{ url_for('auth.dang_nhap') }}" style="color: #1a56db; font-weight: 600; text-decoration: none;">Đăng nhập</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
